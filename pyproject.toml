[project]
name = "hll_rcon_tool"
version = "0.0.1"
target-version = ['py312']
requires-python = ">=3.12"
dependencies = [
    # Alembic does not use semantic versioning, so be careful with the version numbers https://alembic.sqlalchemy.org/en/latest/front.html#versioning-scheme
    "alembic==1.19.1",
    "channels==4.3.2",
    "channels-redis==4.3.0",
    "click==8.4.0",
    "colorlog>=6.12.0",
    "daphne>=4.2.3",
    "discord-py==2.7.1",
    # discord-webhook[async]
    "discord-webhook",
    "django==4.2.30",
    "django-cors-headers==4.9.0",
    "django-ratelimit>=4.1.0",
    "gunicorn>=26.0.0",
    "hllrcon>=2.0.0.0",
    "httpx==0.28.1",
    "humanize==4.16.0",
    "orjson==3.12.0",
    "pre-commit>=4.6.2",
    "psutil==7.2.2",
    "psycopg2-binary>=2.9.12",
    "pydantic==2.13.4",
    "python-dateutil==2.9.0.post0",
    "pytz>=2026.3.post1",
    "redis==8.1.0",
    "requests==2.34.2",
    "rq==2.11.0",
    "rq-scheduler==0.14.0",
    "sentry-sdk[django]==2.68.0",
    "simplejson==4.1.1",
    "sqlalchemy==2.0.49",
    "steam==1.4.4",
    "supervisor>=4.3.0",
]

[tool.ruff]
extend-exclude = [
    # Ignore auto-generated python files
    'alembic/**',
    'rconweb/api/migrations/**'
]

[tool.uv.sources]
discord-webhook = { git = "https://github.com/cemathey/python-discord-webhook", rev = "89ae25140b30a6747de70e5bf16bc5ba04a9b238" }

[dependency-groups]
dev = [
    "cachetools==7.1.7",
    "pytest==9.0.3",
    "ruff==0.15.18",
    "fakeredis==2.37.1",
]
