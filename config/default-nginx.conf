### To edit this file make a copy named nginx.conf, it will be used instead

# --- Real client IP resolution ----------------------------------------------
# nginx currently sees the immediate connecting peer as $remote_addr. If that
# peer is another reverse proxy (Traefik, Caddy, HAProxy, WHM/Apache, another
# nginx) or a Cloudflare Tunnel (cloudflared), $remote_addr is the proxy's IP,
# not the real client's — which breaks the login rate limit below and (if
# forwarded) any client-IP logging on the Django side.
#
# Uncomment and adjust below if you're behind such a proxy/tunnel:
#
#   set_real_ip_from — the ONLY host(s) you trust to set the real-IP header.
#   Never use 0.0.0.0/0: anyone could then spoof their IP and dodge the login
#   rate limit. Accepts an IP, a CIDR, OR a hostname (resolved once, at nginx
#   start/reload, via the system/Docker DNS resolver):
#     - By container/service name (recommended for compose setups): resolved
#       fresh each nginx start/reload, so it survives the container being
#       recreated with a new IP — make sure it starts (and is DNS-registered)
#       before nginx does, e.g. via `depends_on`, and reload/restart nginx
#       after it's recreated so any IP change is picked up.
#     - By CIDR: the docker network subnet the proxy/tunnel lives on.
#
#   real_ip_header — which incoming header carries the real IP.
#     - X-Forwarded-For: set by most reverse proxies and by cloudflared.
#     - CF-Connecting-IP: set by Cloudflare when requests genuinely pass
#       through Cloudflare's proxy/CDN in front of the tunnel/proxy.
#
# set_real_ip_from   172.20.0.3;        # container/service name/proxy IP/CIDR range
# real_ip_header     X-Forwarded-For;   # or CF-Connecting-IP behind Cloudflare's proxy
# real_ip_recursive  on;                # walk a multi-hop X-Forwarded-For to the leftmost trusted client IP
# -----------------------------------------------------------------------------

# $binary_remote_addr: The key for tracking (client IP in binary format)
# zone=mylimit:10m: Creates a 10 megabyte shared memory zone - 1 megabyte stores about 16,000 IP addresses
# rate=10r/s: Allows 10 requests per second
# burst parameter provides a buffer for traffic spikes
limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;

map $remote_addr $proxy_forwarded_elem {
    # IPv4 addresses can be sent as-is
    ~^[0-9.]+$          "for=$remote_addr";

    # IPv6 addresses need to be bracketed and quoted
    ~^[0-9A-Fa-f:.]+$   "for=\"[$remote_addr]\"";

    # Unix domain socket names cannot be represented in RFC 7239 syntax
    default             "for=unknown";
}

map $http_forwarded $proxy_add_forwarded {
    # If the incoming Forwarded header is syntactically valid, append to it
    "~^(,[ \\t]*)*([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?(;([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?)*([ \\t]*,([ \\t]*([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?(;([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?)*)?)*$" "$http_forwarded, $proxy_forwarded_elem";

    # Otherwise, replace it
    default "$proxy_forwarded_elem";
}


server {
        listen 80 default_server;
        listen [::]:80 default_server;
        listen 443 ssl;

        ssl_certificate /certs/cert.crt;
        ssl_certificate_key /certs/key.key;
        ssl_protocols TLSv1.2 TLSv1.1 TLSv1;
        # SSL configuration
        #
        # listen 443 ssl default_server;
        # listen [::]:443 ssl default_server;
        #
        # Note: You should disable gzip for SSL traffic.
        # See: https://bugs.debian.org/773332
        #
        # Read up on ssl_ciphers to ensure a secure configuration.
        # See: https://bugs.debian.org/765782
        #
        # Self signed certs generated by the ssl-cert package
        # Don't use them in a production server!
        #
        # include snippets/snakeoil.conf;

        root /var/www;

        # Add index.php to the list if you are using PHP
        index index.html index.htm index.nginx-debian.html;

        server_name _;
        #auth_basic           "Admin Login";
        #auth_basic_user_file /pw/.htpasswd;

        gzip on;
        gzip_buffers 16 8k;
        gzip_comp_level 6;
        gzip_proxied any;
        gzip_vary on;
        gzip_types text/plain text/css image/svg+xml application/xml application/json text/javascript application/javascript;

        location = /runtime-config.js {
            if_modified_since off;
            expires off;
            etag off;
            add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0' always;
        }

        location / {
            # First attempt to serve request as file, then
            # as directory, then fall back to displaying a 404.
            try_files $uri /index.html;
            add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=6000';
            if_modified_since off;
            expires off;
            etag off;
        }

        location /api {
            # Never let the browser or any reverse proxy (WHM/Apache, Cloudflare, ...)
            # cache live API responses. Matches the public interface below; without this
            # a caching reverse proxy serves stale GET responses (get_gamestate,
            # get_team_view) while POST-based logs stay fresh.
            if_modified_since off;
            expires off;
            etag off;
            add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0' always;
            proxy_set_header Forwarded $proxy_add_forwarded;
            proxy_set_header X-Forwarded-For "$http_x_forwarded_for, $realip_remote_addr";
            proxy_pass http://backend:8000/api;
        }

        location /accounts {
            limit_req zone=login burst=5;
            limit_req_status 429;
            proxy_set_header Forwarded $proxy_add_forwarded;
            proxy_set_header X-Forwarded-For "$http_x_forwarded_for, $realip_remote_addr";
            proxy_pass http://backend:8000/accounts;
        }

        location /djangostatic {
            alias /static;
            autoindex off;
        }

        # Serve media files (user uploads)
        location /media {
            alias /static/media;
            autoindex off;
            expires 30d;
            add_header Cache-Control "public";
        }

        location /admin {
            limit_req zone=login burst=5;
            limit_req_status 429;
            proxy_set_header Forwarded $proxy_add_forwarded;
            proxy_set_header X-Forwarded-For "$http_x_forwarded_for, $realip_remote_addr";
            proxy_pass http://backend:8000/admin;
        }

        location /api/scoreboard {
            auth_basic "off";
            proxy_set_header X-Forwarded-For "$http_x_forwarded_for, $realip_remote_addr";
            proxy_set_header Forwarded $proxy_add_forwarded;
            proxy_pass http://backend:8000/api/scoreboard;
        }

        location /ws {
            proxy_pass http://backend:8001;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For "$http_x_forwarded_for, $realip_remote_addr";
            proxy_set_header Forwarded $proxy_add_forwarded;
            proxy_set_header X-Forwarded-Host $server_name;
        }
}


server {
        listen 81;
        listen [::]:81;
        listen 444 ssl;

        ssl_certificate /certs/cert.crt;
        ssl_certificate_key /certs/key.key;
        ssl_protocols TLSv1.2 TLSv1.1 TLSv1;
        # SSL configuration
        #
        # listen 443 ssl default_server;
        # listen [::]:443 ssl default_server;
        #
        # Note: You should disable gzip for SSL traffic.
        # See: https://bugs.debian.org/773332
        #
        # Read up on ssl_ciphers to ensure a secure configuration.
        # See: https://bugs.debian.org/765782
        #
        # Self signed certs generated by the ssl-cert package
        # Don't use them in a production server!
        #
        # include snippets/snakeoil.conf;

        root /var/www_public;

        # Add index.php to the list if you are using PHP
        index index.html index.htm index.nginx-debian.html;

        server_name _;
        #auth_basic           "Admin Login";
        #auth_basic_user_file /pw/.htpasswd;

        gzip on;
        gzip_buffers 16 8k;
        gzip_comp_level 6;
        gzip_proxied any;
        gzip_vary on;
        gzip_types text/plain text/css image/svg+xml application/xml application/json text/javascript application/javascript;

        location = /runtime-config.js {
            if_modified_since off;
            expires off;
            etag off;
            add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0' always;
        }

        # Serve media files (user uploads)
        location /media {
            alias /static/media;
            autoindex off;
            expires 30d;
            add_header Cache-Control "public";
        }

        # Fallback to index.html for all other routes (SPA routing)
        location / {
            try_files $uri /index.html;  # Serve index.html for all non-existent paths

            # Prevent caching
            if_modified_since off;
            expires off;
            etag off;
        }

        location /api {
            if_modified_since off;
            expires off;
            etag off;
            add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
            proxy_set_header Forwarded $proxy_add_forwarded;
            proxy_set_header X-Forwarded-For "$http_x_forwarded_for, $realip_remote_addr";
            proxy_pass http://backend:8000/api;
        }
}
